plugins {
    id "com.github.gmazzo.buildconfig" version "6.0.7"
}

architectury {
    common(enabled_platforms.split(","))
}

dependencies {
    // Architectury depends on Fabric Loader here to use Fabric @Environment annotations
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")

    modCompileOnly("dev.isxander:yet-another-config-lib:${yacl_version}-fabric")
}

buildConfig {
    packageName("cc.turtl.turtlshell")
    className("BuildConfig")
    useJavaOutput()

    buildConfigField("String", "MOD_ID", "\"${project.property('mod_id')}\"")
    buildConfigField("String", "MOD_DISPLAY_NAME", "\"${project.property('mod_display_name')}\"")
    buildConfigField("String", "VERSION", "\"${project.property('mod_version')}\"")
    buildConfigField("String", "AUTHOR", "\"${project.property('mod_author')}\"")
}