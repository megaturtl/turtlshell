name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }} # Cache writing isn't safe for pull requests

      - name: Build
        run: ./gradlew build
        env:
          GRADLE_OPTS: -Xmx4G -Xms4G

      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

      - name: Upload jar artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
            !**/*dev-shadow*
            !**/*sources*
            !**/*javadoc*

      - name: Publish to maven.turtl.cc
        run: ./gradlew publish
        env:
          MAVEN_USER: ${{ secrets.MAVEN_USER }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}