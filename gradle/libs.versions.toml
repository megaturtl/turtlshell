[versions]
# Kotlin
kotlin = "2.2.20"

# Plugins
shadow = "8.1.1"
versioning = "3.1.0"
idea-ext = "1.1.7"
blossom = "2.1.0"

# Loom
loom = "1.13-SNAPSHOT"
architectury-plugin = "3.4-SNAPSHOT"

# Fabric
fabric-loader = "0.18.4"
fabric-api = "0.116.9+1.21.1"
fabric-kotlin = "1.13.6+kotlin.2.2.20"
mod-menu = "11.0.3"
yet-another-config-lib-fabric = "3.8.1+1.21.1-fabric"

# NeoForge
neoforge = "21.1.219"
neo-kotlin-for-forge = "5.10.0"
yet-another-config-lib-neoforge = "3.8.1+1.21.1-neoforge"

# Testing
junit = "6.0.3"
mockito = "5.22.0"
mockk = "1.14.9"

[libraries]
# General Buildscript Plugins
kotlin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
loom = { group = "dev.architectury", name = "architectury-loom", version.ref = "loom" }
architectury = { group = "architectury-plugin", name = "architectury-plugin.gradle.plugin", version.ref = "architectury-plugin" }
shadow = { group = "com.github.johnrengelman", name = "shadow", version.ref = "shadow" }
ideaExt = { group = "org.jetbrains.gradle.plugin.idea-ext", name = "org.jetbrains.gradle.plugin.idea-ext.gradle.plugin", version.ref = "idea-ext"}
blossom = { group = "net.kyori", name = "blossom", version.ref = "blossom" }
versioning = { group = "net.nemerosa.versioning", name = "net.nemerosa.versioning.gradle.plugin", version.ref = "versioning" }

# Common
yet-another-config-lib-common = { group = "dev.isxander", name = "yet-another-config-lib", version.ref = "yet-another-config-lib-fabric" }

# Kotlin
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }

# Fabric
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-kotlin" }
mod-menu = { group = "com.terraformersmc", name = "modmenu", version.ref = "mod-menu" }
yet-another-config-lib-fabric = { group = "dev.isxander", name = "yet-another-config-lib", version.ref = "yet-another-config-lib-fabric" }

# NeoForge
neoforge = { group = "net.neoforged", name = "neoforge", version.ref = "neoforge" }
neo-kotlin-forge = { group = "thedarkcolour", name = "kotlinforforge-neoforge", version.ref = "neo-kotlin-for-forge" }
yet-another-config-lib-neoforge = { group = "dev.isxander", name = "yet-another-config-lib", version.ref = "yet-another-config-lib-neoforge" }

# Testing
junit-fabric = { group = "net.fabricmc", name = "fabric-loader-junit", version.ref = "fabric-loader" }
junit-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit" }
mockito-core = { group = "org.mockito", name = "mockito-core", version.ref = "mockito" }
mockito-extension = { group = "org.mockito", name = "mockito-junit-jupiter", version.ref = "mockito" }
mock-kotlin = { group = "io.mockk", name = "mockk", version.ref = "mockk" }

[bundles]
kotlin = [ "kotlin-stdlib", "kotlin-reflect" ]
common-integrations-compileOnly = [ "yet-another-config-lib-common" ]
fabric-integrations-implementation = [ "fabric-kotlin", "mod-menu" ]
fabric-integrations-runtimeOnly = [ "yet-another-config-lib-fabric" ]
neoforge-integrations-runtimeOnly = [ "yet-another-config-lib-neoforge" ]
unitTesting = [ "junit-fabric", "junit-params", "mockito-core", "mockito-extension", "mock-kotlin" ]
